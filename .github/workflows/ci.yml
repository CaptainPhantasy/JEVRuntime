name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check src tests
      - name: Pytest
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: Clean-venv demo smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/jev --version | grep -qx "jev 0.2.0"
          /tmp/smoke/bin/jev --help > /dev/null
          /tmp/smoke/bin/jev doctor
          mkdir -p "$HOME/JevDemo"
          /tmp/smoke/bin/python scripts/demo_smoke.py "$HOME/JevDemo"
          /tmp/smoke/bin/jev --demo --output "$HOME/JevDemo" status
